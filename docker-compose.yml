services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    # Ten sam UID/GID co użytkownik na hoście, żeby pliki tworzone przez appkę
    # (zdjęcia, QR) w zamontowanym storage/ nie stawały się własnością roota.
    # Jeśli Twój użytkownik ma inne UID/GID niż 1000:1000, wyeksportuj
    # zmienne UID i GID przed `docker compose up`.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # --no-reload: bez tego `php artisan serve` restartuje CAŁY proces w
    # środku żądania, gdy wykryje zmianę pliku .env — a Instalator i Moduł
    # Aktualizacje właśnie do niego piszą jako część własnej logiki. Restart
    # w połowie żądania zrywa połączenie z klientem (pusta strona/HTTP 000)
    # zanim odpowiedź zdąży dotrzeć — nie problem środowiska, tylko
    # sprzeczność między tą appką a domyślnym trybem dev-serwera Laravela.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    # Czytane z tego samego .env, którego używa Laravel (Docker Compose sam
    # ładuje plik .env z katalogu projektu) — zmień DB_DATABASE/DB_USERNAME/
    # DB_PASSWORD w .env PRZED pierwszym uruchomieniem, żeby ustawić własne
    # dane logowania do bazy zamiast wartości domyślnych.
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-craty}
      MARIADB_USER: ${DB_USERNAME:-craty}
      MARIADB_PASSWORD: ${DB_PASSWORD:-craty}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db-data:
