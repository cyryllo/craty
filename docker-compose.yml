services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    # Ten sam UID/GID co użytkownik na hoście, żeby pliki tworzone przez appkę
    # (zdjęcia, QR) w zamontowanym app-storage/ nie stawały się własnością
    # roota. Jeśli Twój użytkownik ma inne UID/GID niż 1000:1000, wyeksportuj
    # zmienne UID i GID przed `docker compose up`.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    # Domyślny CMD obrazu (apache2-foreground) wystarcza — Apache, w
    # przeciwieństwie do `php artisan serve`, nie restartuje się w środku
    # żądania, gdy Instalator/Moduł Aktualizacje zapiszą .env, więc nie ma
    # tu odpowiednika dawnego --no-reload do pilnowania.

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    # Czytane z tego samego .env, którego używa Laravel (Docker Compose sam
    # ładuje plik .env z katalogu projektu) — zmień DB_DATABASE/DB_USERNAME/
    # DB_PASSWORD w .env PRZED pierwszym uruchomieniem, żeby ustawić własne
    # dane logowania do bazy zamiast wartości domyślnych.
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-craty}
      MARIADB_USER: ${DB_USERNAME:-craty}
      MARIADB_PASSWORD: ${DB_PASSWORD:-craty}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
