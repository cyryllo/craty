<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /var/www/html

    # AllowOverride All jest krytyczne: appka nie ma osobnego document
    # rootu (patrz CLAUDE.md "Project layout") — ochrona .env/app/vendor
    # zależy WYŁĄCZNIE od reguł w .htaccess w każdym z tych katalogów.
    # Domyślny apache2.conf Debiana ustawia AllowOverride None dla
    # /var/www/, więc bez tego bloku .htaccess byłby po cichu ignorowany
    # i cały kod appki byłby publicznie pobieralny przez przeglądarkę.
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
