# Dodatki do vhosta (docker/apache/000-default.conf) w obrazie produkcyjnym.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Pliki bazy leżą w wolumenie app-storage/. Cały app-storage/ i tak jest
# blokowany regułą w głównym .htaccess, to druga linia obrony na poziomie
# serwera (nie blokujemy całego app-storage/ tutaj, bo zablokowałoby to też
# app-storage/app/public, czyli zdjęcia i kody QR za symlinkiem storage).
<Directory /var/www/html/app-storage/database>
    Require all denied
</Directory>
